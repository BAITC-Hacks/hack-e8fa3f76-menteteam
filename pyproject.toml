[project]
name = "alem-minutes"
version = "0.1.0"
description = "Offline meeting protocol assistant with local AI models"
requires-python = ">=3.12,<3.14"
dependencies = [
  "streamlit>=1.45,<2",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "python-docx>=1.1,<2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
ai = ["faster-whisper>=1.2,<2", "torch>=2.8,<2.9", "torchvision>=0.23,<0.24", "transformers>=5.5,<6", "accelerate>=1.4,<2", "librosa>=0.11,<1"]
diarization = ["pyannote.audio>=4,<5", "torchaudio>=2.8,<2.9", "torchcodec>=0.7,<0.8"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }, { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }, { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }, { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }]
torchcodec = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
